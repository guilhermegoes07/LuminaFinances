services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: financial-manager-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - DATABASE_URL=postgresql://financial_user:financial_password@db:5432/financial_manager
    networks:
      - financial-network
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: financial-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: financial_manager
      POSTGRES_USER: financial_user
      POSTGRES_PASSWORD: financial_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - financial-network
    ports:
      - "5432:5432"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    networks:
      - financial-network

networks:
  financial-network:
    driver: bridge

volumes:
  postgres_data:
